on:
  workflow_dispatch:
  push:
    branches: main

name: Render and Publish

jobs:
  build-deploy:
    # Permissions are set by the caller: the reusable workflow's token is the
    # intersection of the two, so dropping this fails the gh-pages push.
    permissions:
      contents: write
    uses: GWAC-MPPR/.github/.github/workflows/quarto-slides.yml@v1
    with:
      use-renv: true
      release-tag: slides-2026
